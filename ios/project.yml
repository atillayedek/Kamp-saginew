# Xcode project for KampüsAğı iOS, generated by XcodeGen in CI (`xcodegen generate`).
# The .xcodeproj is not committed; this file is the source of truth.
name: KampusAgi
options:
  bundleIdPrefix: com.kampusagi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/KampusAgi.xcconfig
  Release: Config/KampusAgi.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: $(KAMPUSAGI_BUILD_NUMBER)
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  KampusAgi:
    type: application
    platform: iOS
    sources:
      - path: KampusAgi
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Config/KampusAgi-Info.plist
      properties:
        CFBundleDisplayName: KampüsAğı
        CFBundleDevelopmentRegion: tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.kampusagi.auth
            CFBundleURLSchemes: [kampusagi]
        # Client-safe values only, filled from Config/Secrets.xcconfig (never committed).
        KampusAgiSupabaseURL: $(SUPABASE_URL)
        KampusAgiSupabaseAnonKey: $(SUPABASE_ANON_KEY)
        KampusAgiWebsiteURL: $(WEBSITE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kampusagi.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  KampusAgiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KampusAgiTests
    dependencies:
      - target: KampusAgi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kampusagi.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KampusAgi:
    build:
      targets:
        KampusAgi: all
        KampusAgiTests: [test]
    test:
      targets: [KampusAgiTests]
