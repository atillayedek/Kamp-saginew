name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database migrations and SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PostgreSQL 16 with pgvector, as on Supabase.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL tests
        run: ./scripts/test-db.sh

  edge-functions:
    name: Edge Function type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno check supabase/functions/*/index.ts
      - name: Tests
        run: deno test supabase/functions/

  web:
    name: Web (landing + admin) lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Built without Supabase values: the admin page must show "kurulum gerekli", never fake data.
      - run: npm run build

  live-smoke:
    name: Live Supabase checks (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the deployed backend over HTTP
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase secrets missing: live checks NOT RUN."
            exit 0
          fi
          ./scripts/live-smoke.sh

  android:
    name: Unit tests, lint, debug APK and release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Report backend configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        # Prints only whether the values are present, never the values.
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::Supabase configured: this build connects to the backend."
          else
            echo "::warning::Supabase secrets missing: this build shows the 'not configured' screen."
          fi
          if [ -n "$WEBSITE_URL" ]; then
            echo "::notice::Website URL configured: privacy policy and terms links are in the app."
          elif [ -n "$PRIVACY_POLICY_URL" ]; then
            echo "::warning::WEBSITE_URL variable missing: the terms of use link is not in the app."
          else
            echo "::warning::WEBSITE_URL variable missing: the app states that the privacy policy and terms are not available."
          fi

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KAMPUSAGI_KEYSTORE_BASE64 }}
        # Reports only whether a keystore is available, never its contents.
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KAMPUSAGI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "::notice::Release keystore provided: the release AAB is signed."
          else
            echo "::warning::KAMPUSAGI_KEYSTORE_BASE64 missing: the release AAB is unsigned and cannot be uploaded to Google Play."
          fi

      - name: Build and verify
        env:
          KAMPUSAGI_KEYSTORE_PASSWORD: ${{ secrets.KAMPUSAGI_KEYSTORE_PASSWORD }}
          KAMPUSAGI_KEY_ALIAS: ${{ secrets.KAMPUSAGI_KEY_ALIAS }}
          KAMPUSAGI_KEY_PASSWORD: ${{ secrets.KAMPUSAGI_KEY_PASSWORD }}
          KAMPUSAGI_VERSION_CODE: ${{ github.run_number }}
          # Client-safe values only (project URL + anon/publishable key).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintRelease assembleDebug bundleRelease

      - name: Check release bundle signature
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          RESULT="$(jarsigner -verify "$AAB")"
          echo "$RESULT"
          if [ -n "${KAMPUSAGI_KEYSTORE_FILE:-}" ]; then
            echo "$RESULT" | grep -q "jar verified." || { echo "::error::Release AAB signature did not verify."; exit 1; }
          else
            echo "::warning::Release AAB is unsigned (no keystore secret)."
          fi

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
